    <text x="56" y="133" fill="#f4f6f9" font-size="52" font-weight="650" letter-spacing="-2">Minjae Lee</text>
    <text x="58" y="181" fill="#d0dfd4" font-size="22">Ambitious products. Dependable decisions.</text>
